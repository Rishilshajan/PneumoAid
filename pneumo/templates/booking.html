<!DOCTYPE html>
<html>
<head>
    <title>Patient Booking System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 100vh;
            background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.9)),
                        url('https://images.unsplash.com/photo-1586773860418-d37222d8fce3?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
        }

        .form-container {
            padding: 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            height: 100vh;
            overflow-y: auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            color: #2c3e50;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #34495e;
            font-weight: 500;
            font-size: 1.1rem;
        }

        input, select {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: white;
        }

        input:focus, select:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 8px rgba(52, 152, 219, 0.3);
        }

        button {
            background: #3498db;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 20px;
        }

        button:hover {
            background: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .image-side {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
            background: rgba(52, 152, 219, 0.1);
        }

        .hospital-info {
            text-align: center;
            color: #2c3e50;
        }

        .hospital-info h1 {
            font-size: 2.5rem;
            margin-bottom: 20px;
            color: #3498db;
        }

        @media (max-width: 768px) {
            body {
                grid-template-columns: 1fr;
            }
            
            .image-side {
                display: none;
            }
            
            .form-container {
                padding: 20px;
            }
        }

        .loading {
            color: #7f8c8d;
            font-style: italic;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <a href="{{ url_for('user_dashboard') }}" style="display: inline-block; margin-bottom: 20px; color: #3498db; text-decoration: none; font-size: 1rem;">
            <i class="fas fa-arrow-left"></i> Back
        </a>
        
        <div class="form-header">
            <h2>Book Your Appointment</h2>
            <p>Fast and convenient healthcare access</p>
        </div>
        
        <form id="bookingForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" required placeholder="John Doe">
            </div>
            
            <div class="form-group">
                <label for="age">Age</label>
                <input type="number" id="age" required placeholder="30">
            </div>
            
            <div class="form-group">
                <label for="gender">Gender</label>
                <select id="gender" required>
                    <option value="">Select Gender</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required placeholder="john@example.com">
            </div>
            
            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" required placeholder="+1 234 567 890">
            </div>
            
            <div class="form-group">
                <label for="hospital">Hospital</label>
                <select id="hospital" required>
                    <option value="">Loading hospitals...</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="doctor">Doctor</label>
                <select id="doctor" required disabled>
                    <option value="">Select hospital first</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="time">Available Sessions</label>  <!-- Changed label -->
                <select id="time" required disabled>
                    <option value="">Select doctor first</option>
                </select>
            </div>
            
            <button type="submit">
                <i class="fas fa-calendar-check"></i> Confirm Appointment
            </button>
        </form>
    </div>

    <div class="image-side">
        <div class="hospital-info">
            <h1>Mary Queens Hospital</h1>
            <p>Your Health is Our Priority</p>
            <div class="features">
                <p><i class="fas fa-check-circle"></i> 24/7 Emergency Care</p>
                <p><i class="fas fa-check-circle"></i> Expert Medical Staff</p>
                <p><i class="fas fa-check-circle"></i> State-of-the-Art Facilities</p>
            </div>
        </div>
    </div>

    <script>
       document.addEventListener('DOMContentLoaded', async () => {
    const hospitalSelect = document.getElementById('hospital');
    const doctorSelect = document.getElementById('doctor');
    const timeSelect = document.getElementById('time');

    // Load hospitals
    try {
        hospitalSelect.innerHTML = '<option value="">Loading hospitals...</option>';
        const response = await fetch('/api/hospitals');
        if (!response.ok) throw new Error('Failed to load hospitals');
        const hospitals = await response.json();
        
        hospitalSelect.innerHTML = '<option value="">Select Hospital</option>';
        hospitals.forEach(hospital => {
            const option = document.createElement('option');
            option.value = hospital._id;
            option.textContent = hospital.name;
            hospitalSelect.appendChild(option);
        });
    } catch (error) {
        hospitalSelect.innerHTML = '<option value="">Error loading hospitals</option>';
        console.error('Hospital load error:', error);
    }

    // Hospital change handler
    hospitalSelect.addEventListener('change', async (e) => {
        doctorSelect.disabled = true;
        timeSelect.disabled = true;
        
        if (!e.target.value) {
            doctorSelect.innerHTML = '<option value="">Select hospital first</option>';
            return;
        }

        try {
            doctorSelect.innerHTML = '<option value="">Loading doctors...</option>';
            const response = await fetch(`/api/doctors/${e.target.value}`);
            if (!response.ok) throw new Error('Failed to load doctors');
            const doctors = await response.json();
            
            doctorSelect.innerHTML = '<option value="">Select Doctor</option>';
            doctors.forEach(doctor => {
                const option = document.createElement('option');
                option.value = doctor.id;
                option.textContent = `${doctor.name} - ${doctor.specialization}`;
                doctorSelect.appendChild(option);
            });
            doctorSelect.disabled = false;
        } catch (error) {
            doctorSelect.innerHTML = '<option value="">Error loading doctors</option>';
            console.error('Doctor load error:', error);
        }
    });

    // Doctor change handler
    doctorSelect.addEventListener('change', async (e) => {
        timeSelect.disabled = true;
        
        if (!e.target.value) {
            timeSelect.innerHTML = '<option value="">Select doctor first</option>';
            return;
        }

        try {
            timeSelect.innerHTML = '<option value="">Loading available times...</option>';
            const response = await fetch(`/api/sessions/${e.target.value}`);
            if (!response.ok) throw new Error('Failed to load sessions');
            const sessions = await response.json();
            
            timeSelect.innerHTML = '<option value="">Select Time</option>';
            sessions.forEach(session => {
                const option = document.createElement('option');
                option.value = session.id;
                const date = new Date(session.date).toLocaleDateString();
                option.textContent = `${date} ${session.start_time} - ${session.end_time}`;
                timeSelect.appendChild(option);
            });
            timeSelect.disabled = false;
        } catch (error) {
            timeSelect.innerHTML = '<option value="">Error loading sessions</option>';
            console.error('Session load error:', error);
        }
    });

    // Form submission
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const formData = {
            name: document.getElementById('name').value,
            age: document.getElementById('age').value,
            gender: document.getElementById('gender').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value,
            hospital: document.getElementById('hospital').value,
            doctor: document.getElementById('doctor').value,
            time: document.getElementById('time').value
        };

        try {
            const response = await fetch('/api/bookings', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(formData)
            });

            if (!response.ok) throw new Error('Booking failed');
            
            const result = await response.json();  
            alert(`Appointment booked! Your token: ${result.token}`);  
        } catch (error) {
            alert('Error: ' + error.message);
        }
    });
});
    </script>
</body>
</html>
